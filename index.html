<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mingle Bullet Journal</title>
  
  <!-- 기존에 쓰던 폰트 및 아이콘 링크 (FontAwesome 등) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    /* 기본 리셋 및 전역 스타일 */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: #f7f5f2; color: #333; overflow-x: hidden; padding-bottom: 70px; }
    
    /* 하단 네비게이션 바 (글자 수 2글자 맞춤!) */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
      background: #ffffff; border-top: 1px solid #e5e5e5;
      display: flex; justify-content: space-around; align-items: center; z-index: 9999;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: none; border: none; color: #a0a0a0; font-size: 11px; font-weight: 600;
      width: 25%; height: 100%; cursor: pointer; transition: 0.2s;
    }
    .nav-btn i { font-size: 20px; margin-bottom: 4px; }
    .nav-btn.active { color: #8b6b4a; } /* 활성화 시 감성 브라운 컬러 */

    /* 페이지 컨테이너 */
    .page { display: none; padding: 20px; width: 100%; max-width: 600px; margin: 0 auto; }
    .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* 서랍장 상단 서브 탭 (독서/뜨개/가계부) */
    .drawer-sub-nav { display: flex; gap: 10px; margin-bottom: 20px; }
    .sub-tab-btn { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #e0e0e0; background: #fff; font-weight: 600; color: #666; cursor: pointer; }
    .sub-tab-btn.active { background: #8b6b4a; color: #fff; border: none; }
  </style>
</head>
<body>

  <!-- 1. 【 오늘 】 탭 : 데일리 다이어리, 식단, OOTD, 타임테이블 -->
  <section id="page-today" class="page active">
    <div id="today-container">
      <!-- day.js에서 이 안쪽으로 화면 구성 요소들이 렌더링 됩니다 -->
    </div>
  </section>

  <!-- 2. 【 일정 】 탭 : 캘린더 달력, 기념일, 예매 확인(티켓) -->
  <section id="page-calendar" class="page">
    <div id="calendar-container">
      <!-- calendar.js에서 이 안쪽으로 달력과 카드들이 렌더링 됩니다 -->
    </div>
  </section>

  <!-- 3. 【 습관 】 탭 : 무드, 루틴 진행도, 건강 관리(kg) 트래커 -->
  <section id="page-tracker" class="page">
    <div id="tracker-container">
      <!-- day.js와 연동되어 트래커 잔디밭이 렌더링 됩니다 -->
    </div>
  </section>

  <!-- 4. 【 서랍 】 탭 : 가계부, 독서 책장, 뜨개 쇼룸 -->
  <section id="page-drawer" class="page">
    <div class="drawer-sub-nav">
      <button class="sub-tab-btn active" onclick="switchDrawerTab('budget')">💰 가계부</button>
      <button class="sub-tab-btn" onclick="switchDrawerTab('book')">📚 독서</button>
      <button class="sub-tab-btn" onclick="switchDrawerTab('knit')">🧶 뜨개</button>
    </div>
    
    <!-- 가계부 모듈 (월별 예산, 소비 캘린더, 지출 리스트) -->
    <div id="drawer-budget" class="drawer-content"></div>
    
    <!-- 독서 모듈 (북적북적 4대 상태, 리더스 자동계산) -->
    <div id="drawer-book" class="drawer-content" style="display:none;"></div>
    
    <!-- 뜨개 모듈 -->
    <div id="drawer-knit" class="drawer-content" style="display:none;"></div>
  </section>

  <!-- 하단 4대 탭 네비게이션 -->
  <nav id="bottom-nav">
    <button class="nav-btn active" onclick="changeMainTab('today', this)"><i class="fas fa-sun"></i>오늘</button>
    <button class="nav-btn" onclick="changeMainTab('calendar', this)"><i class="fas fa-calendar-alt"></i>일정</button>
    <button class="nav-btn" onclick="changeMainTab('tracker', this)"><i class="fas fa-seedling"></i>습관</button>
    <button class="nav-btn" onclick="changeMainTab('drawer', this)"><i class="fas fa-archive"></i>서랍</button>
  </nav>

  <!-- 각종 입력 모달(팝업)들이 들어갈 공통 컨테이너 -->
  <div id="modal-container"></div>

  <!-- 파이어베이스 SDK (v9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <!-- 📁 분할된 기능 스크립트 연결 (이 순서대로 로드되어야 합니다) -->
  <script src="js/firebase.js"></script>
  <script src="js/day.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/drawer.js"></script>

  <!-- 화면 전환을 위한 아주 간단한 인라인 스크립트 -->
  <script>
    // 메인 하단 탭 전환 함수
    function changeMainTab(tabId, btnElement) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById('page-' + tabId).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
    }

    // 서랍장 내부 서브 탭 전환 함수
    function switchDrawerTab(subTabId) {
      document.querySelectorAll('.drawer-content').forEach(content => content.style.display = 'none');
      document.getElementById('drawer-' + subTabId).style.display = 'block';
      
      document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
